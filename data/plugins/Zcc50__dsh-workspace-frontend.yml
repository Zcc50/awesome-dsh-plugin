description:
  en: Rebuilds the sidebar into a workspace / group / session tree with drag-to-group, per-row status and context rings, session cost, and resizable sidebars.
  zh: 把左侧栏重做成「工作区 → 分组 → 会话」树，支持拖拽归组、行内状态环与上下文环、会话花费显示，以及可拖拽调宽的侧栏把手。
